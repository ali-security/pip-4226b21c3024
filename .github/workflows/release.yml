name: Publish Python 🐍 distribution 📦 to PyPI

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2
        with:
          persist-credentials: false
      - name: Pin the HEAD commit date to the upstream 26.1 tag commit
        # build-project.py derives SOURCE_DATE_EPOCH from the HEAD commit
        # timestamp, which sets every archive entry mtime in the sdist and the
        # wheel. The fork rebuilds the commit, so its timestamp differs from
        # upstream's; 1777225056 is the timestamp of upstream's 26.1 tag commit
        # (90b2b3e0f7ef75c485155716d904e51654575803). Re-stamping HEAD keeps the
        # rebuilt distributions byte-identical to the released ones.
        run: |
          git config user.email "pypa-dev@googlegroups.com"
          git config user.name "pip"
          GIT_COMMITTER_DATE="@1777225056 +0200" \
            git commit --amend --no-edit --date="@1777225056 +0200"
          git log -1 --pretty=format:%ct
      - name: Build a binary wheel and a source tarball
        run: ./build-project/build-project.py
      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
